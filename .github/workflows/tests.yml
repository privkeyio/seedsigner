name: CI

on:
  push:
  pull_request:

# Explicitly restrict the auto-provisioned GITHUB_TOKEN to the least privilege required
# for this workflow.
permissions:
  contents: read

concurrency:
  # Concurrency group that uses the workflow name and PR number if available
  # or commit SHA as a fallback. If a new build is triggered under that
  # concurrency group while a previous build is running it will be canceled.
  # Repeated pushes to a PR will cancel all previous builds, while multiple
  # merges to main will not cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # Used by the `Version` class so it can identify the current fork
  PR_AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}

  # Used by `Version`. We want the PR author's latest commit hash if this is a PR
  # but the default SHA env var reflects a new commit into the target repo.
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 3.10: currently used by Seedsigner
        # 3.12: latest stable Python as upper test bound
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Needs to also pull the seedsigner-translations repo
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            tests/requirements-ci.txt
            l10n/requirements-l10n.txt
            requirements.txt
      - name: Install dependencies
        run: |
          sudo apt-get install libzbar0
          python -m pip install --upgrade pip
          # Fail loudly if the lock has drifted from the files it was generated from.
          # Names are compared PEP 503 normalized, because the lock is generated with
          # them lowercased (Pillow becomes pillow).
          for pkg in $(grep -hvE '^\s*#|^\s*$|@ git\+' requirements.txt tests/requirements.txt); do
            name=$(echo "${pkg%%==*}" | tr 'A-Z' 'a-z' | tr '_.' '--')
            norm="${name}==${pkg#*==}"
            grep -qxF "${norm} \\" tests/requirements-ci.txt || {
              echo "::error::${pkg} is not pinned in tests/requirements-ci.txt; regenerate it"; exit 1; }
          done
          # Everything from PyPI, with its transitive dependencies, verified by hash.
          pip install --require-hashes -r tests/requirements-ci.txt
          pip install --require-hashes -r l10n/requirements-l10n.txt
          # pip turns --require-hashes on for every requirement in the same command, and a
          # git SHA pin cannot carry a hash, so the two git dependencies install on their
          # own. The SHA is itself immutable, and neither declares a runtime dependency,
          # so --no-deps leaves nothing floating.
          # --no-build-isolation so the build backend is the hashed setuptools installed
          # above rather than an unpinned one fetched at build time. Both of these build
          # from source, so without it the one unhashed download in the job is the thing
          # that runs arbitrary setup code.
          grep '@ git+' requirements.txt | xargs -r -d '\n' pip install --no-deps --no-build-isolation
          pip install --no-build-isolation -e .
      - name: Compile translations
        run: python setup.py compile_catalog
      - name: Test with pytest
        run: |
          mkdir -p artifacts
          python -m pytest \
            --color=yes \
            --cov=seedsigner \
            --cov-branch \
            --durations 5 \
            -vv
      - name: Generate screenshots
        run: |
          python -m pytest tests/screenshot_generator/generator.py \
            --color=yes \
            --cov=seedsigner \
            --cov-append \
            --cov-branch \
            --cov-report html:./artifacts/cov_html \
            -vv
          cp -r ./seedsigner-screenshots ./artifacts/
      - name: Coverage report
        run: coverage report
      - name: Archive CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts-${{ matrix.python-version }}
          path: artifacts/**
          retention-days: 10
        # Upload also when tests fail. The workflow result (red/green) will
        # not be affected by this.
        if: always()
